name: Update Collection, Wants, and Profile

on:
  schedule:
    - cron: '0 0 * * *'  # run every day at midnight UTC
  workflow_dispatch:     

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run fetchData.js
      env:
        API_KEY: ${{ secrets.API_KEY }}
      run: node src/fetchData.js

    - name: Run fetchCollection.js
      env:
        API_KEY: ${{ secrets.API_KEY }}
      run: node src/fetchCollection.js

    - name: Run fetchWants.js
      env:
        API_KEY: ${{ secrets.API_KEY }}
      run: node src/fetchWants.js

    - name: Commit changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add public/audios.json public/videos.json public/new.json public/profile.json public/wants.json
        git commit -m "Update collection, wants, and profile" || echo "No changes to commit"
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        git pull --rebase origin main

        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
   
    - name: Upload public folder
      uses: actions/upload-pages-artifact@v4
      with:
        path: './public'

    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
